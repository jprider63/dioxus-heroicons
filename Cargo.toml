[package]
name = "dioxus-heroicons"
version = "0.5.1"
authors = ["Dave Rolsky <autarch@urth.org>"]
description = "Dioxus components for heroicons (https://heroicons.com/)"
repository = "https://github.com/houseabsolute/dioxus-heroicons"
readme = "README.md"
license = "Apache-2.0 OR MIT"
edition = "2018"

[dependencies]
dioxus = { git = "https://github.com/jprider63/dioxus.git", rev="612d510d2cb194c1da9c216629ba6bb88f74006c", features = ["html"] }

[workspace]
members = ["gen"]

[workspace.metadata.release]
allow-branch = ["master"]
